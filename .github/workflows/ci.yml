name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zig:
    name: Zig Build & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        zig-version: [0.16.0]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Run Zig fmt check
        run: zig fmt --check .

      - name: Build project
        run: zig build

      - name: Build optimized release
        run: zig build -Doptimize=ReleaseFast

  markdown:
    name: Markdown Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Check markdown formatting
        run: markdownlint . --ignore node_modules --ignore .git --ignore docs --ignore tmp --ignore dist

  js:
    name: JS Format & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Check JS formatting
        run: bun x prettier@3.8 --no-semi --check opencode/plugins tests

      - name: Run JS tests
        run: bun test tests/design-reminders.test.js tests/zmask-pii.test.js

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base_depth: 0
